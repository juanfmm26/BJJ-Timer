plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt((project.findProperty('vc') ?: '1').toString())

android {
    namespace 'com.nuevaera.timer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nuevaera.timer'
        minSdk 23
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
